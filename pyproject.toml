[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chief-of-staff-ai"
version = "2.2.0"
description = "Grounded, evaluated LLM pipeline that turns Slack and email into a prioritized, deduplicated commitment ledger."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["llm", "information-extraction", "evaluation", "langgraph", "anthropic", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rapidfuzz>=3.9",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
graph = ["langgraph>=0.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
gmail = ["google-api-python-client>=2.100", "google-auth>=2.30", "google-auth-oauthlib>=1.2"]
all = ["chief-of-staff-ai[anthropic,gemini,graph,api,gmail]"]
dev = [
  "chief-of-staff-ai[anthropic,gemini,graph,api]",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "jsonschema>=4.21",
  "pillow>=10",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
cos = "chief_of_staff.cli:app"

[project.urls]
Repository = "https://github.com/pavan-dangeti/Chief-of-Staff-AI"

[tool.hatch.build.targets.wheel]
packages = ["src/chief_of_staff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["perf: timing-sensitive performance checks"]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
  "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]

[tool.coverage.run]
source = ["chief_of_staff"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PIE", "RET", "PL"]
# PLC0415: provider SDKs are optional extras, so their imports are deliberately lazy.
# SIM905: word lists written as one string and split() are easier to read and review.
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "RUF001", "PLC0415", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"src/chief_of_staff/cli.py" = ["PLR0917"]
"tests/**" = ["PLR2004", "PT018", "PLR0917", "E501"]
"datasets/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
