repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      # Needs: pre-commit install --hook-type commit-msg
      - id: no-attribution-lines
        name: commit messages carry no attribution trailers
        language: pygrep
        entry: '^\s*(co-authored-by:|(🤖\s*)?generated with)'
        args: [--ignore-case, --multiline]
        stages: [commit-msg]
