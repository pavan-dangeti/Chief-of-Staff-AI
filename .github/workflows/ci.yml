name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    # Commit messages hold the change and its reason; trailers crediting other authors or tools are not used.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Commit messages carry no attribution trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push has no usable base: check everything reachable from HEAD.
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then range="${BASE}..${HEAD}"; else range="${HEAD}"; fi
          bad=$(git log --format='%h %s' -i -E --grep='^[[:space:]]*(co-authored-by:|(🤖[[:space:]]*)?generated with)' "$range")
          if [ -n "$bad" ]; then
            echo "Commits with an attribution trailer:"; echo "$bad"; exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests benchmarks docs
          ruff format --check src tests benchmarks docs
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Offline evaluation (regression guard)
        run: cos eval --split test --backend heuristic --no-cache --report reports/heuristic-test.md
      - name: Production-style run against the provider simulator
        if: matrix.python-version == '3.12'
        run: python benchmarks/production_run.py --report reports/production-run.md

  llm-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[anthropic]"
      - run: make eval-llm BACKEND=anthropic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-eval-reports
          path: reports/
