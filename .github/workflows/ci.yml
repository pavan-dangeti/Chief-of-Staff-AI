name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests benchmarks docs
          ruff format --check src tests benchmarks docs
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Offline evaluation (regression guard)
        run: cos eval --split test --backend heuristic --no-cache --report reports/heuristic-test.md
      - name: Production-style run against the provider simulator
        if: matrix.python-version == '3.12'
        run: python benchmarks/production_run.py --report reports/production-run.md

  llm-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[anthropic]"
      - run: make eval-llm BACKEND=anthropic
      - uses: actions/upload-artifact@v4
        with:
          name: llm-eval-reports
          path: reports/
